<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1A237E"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Оплата"/>
  <meta name="description" content="Кабинет оплаты Weltkind"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-180.png"/>
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <title>Оплата Weltkind</title>
  <style>
    html,body{height:100%;margin:0;background:#1A237E;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1A237E;z-index:2}
    .logo{width:88px;height:88px;border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.28)}
    .logo img{width:100%;height:100%;display:block}
    .brand{font-size:1.5rem;font-weight:700;letter-spacing:.12em}
    .sub{font-size:.82rem;opacity:.75}
    .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#00C4B4;border-radius:50%;animation:s .8s linear infinite;margin-top:8px}
    @keyframes s{to{transform:rotate(360deg)}}
    #go{display:none;margin-top:18px;border:0;border-radius:14px;padding:14px 22px;background:#00C4B4;color:#07332f;font-weight:700;font-size:1rem}
    #go.show{display:inline-block}
    #err{display:none;max-width:320px;text-align:center;font-size:.85rem;line-height:1.45;opacity:.9;margin-top:8px}
    #err.show{display:block}
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><img src="icons/icon-192.png" alt=""/></div>
    <div class="brand">WELTKIND</div>
    <div class="sub">Открываем кабинет оплаты</div>
    <div class="spin" aria-hidden="true"></div>
    <p id="err">Если кабинет не открылся, нажмите кнопку.</p>
    <button type="button" id="go">Открыть кабинет</button>
  </div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxfUBsBIMK6qULmIlqfxoOR9bWtjmc4uofYt3jWjGMd0Ql8kL4u32a7I9cgl22N3pJt8g/exec';
function gasTarget(){
  const u = new URL(GAS_URL);
  const here = new URL(location.href);
  ['phone','ref','register','message'].forEach(function(k){
    const v = here.searchParams.get(k);
    if (v) u.searchParams.set(k, v);
  });
  const h = (here.hash || '').replace('#','').toLowerCase();
  if (h === 'register') u.searchParams.set('register','1');
  if (h === 'renew') u.searchParams.set('message','Продлите подписку ниже');
  u.searchParams.set('from','pwa');
  return u.toString();
}
function openCabinet(){
  location.replace(gasTarget());
}
document.getElementById('go').onclick = openCabinet;
setTimeout(function(){ document.getElementById('go').classList.add('show'); document.getElementById('err').classList.add('show'); }, 2500);
setTimeout(openCabinet, 900);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){
    if (reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
    reg.update().catch(function(){});
  }).catch(function(){});
}
</script>
</body>
</html>
