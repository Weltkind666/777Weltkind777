<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1A237E"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Оплата"/>
  <meta name="description" content="Кабинет оплаты Weltkind"/>
  <link rel="preconnect" href="https://152.228.99.155:8443" crossorigin/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-180.png"/>
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <title>Оплата Weltkind</title>
  <style>
    html,body{height:100%;margin:0;background:#121A5C;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #splash{position:fixed;inset:0;z-index:4;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(120% 80% at 50% 20%,#283593 0%,#1A237E 48%,#121A5C 100%);transition:opacity .28s ease,visibility .28s}
    #splash.out{opacity:0;visibility:hidden;pointer-events:none}
    .logo{width:92px;height:92px;border-radius:24px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}
    .logo img{width:100%;height:100%;display:block}
    .brand{font-size:1.45rem;font-weight:750;letter-spacing:.18em}
    .sub{font-size:.92rem;opacity:.82;text-align:center;padding:0 28px;line-height:1.45;max-width:300px}
    .bar{width:120px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:8px}
    .bar>i{display:block;height:100%;width:40%;background:#00C4B4;border-radius:99px;animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    #retry{display:none;margin-top:18px;border:0;border-radius:14px;padding:12px 22px;background:#00C4B4;color:#052e2b;font-weight:800;font-size:.95rem}
    #splash.stuck #retry{display:inline-block}
    #splash.stuck .bar{display:none}
    #splashInstall{display:none;margin-top:14px;border:0;border-radius:14px;padding:12px 18px;background:#FFD700;color:#1A237E;font-weight:800;font-size:.92rem;max-width:280px;width:calc(100% - 48px)}
    #splash.stuck #splashInstall,#splash:not(.out) #splashInstall.ready{display:inline-block}
    #installBar{display:none;position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:5;background:#fff;color:#1A237E;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.22);align-items:center;gap:10px}
    #installBar.show{display:flex}
    #installBar span{flex:1;font-size:.82rem;font-weight:650;line-height:1.3}
    #installBtn{border:0;border-radius:10px;padding:9px 12px;background:#1A237E;color:#fff;font-weight:800;white-space:nowrap;font-size:.8rem}
    #installHide{border:0;background:transparent;color:#6B7C8A;font-size:1.15rem;padding:2px 6px}
    #installHelp{display:none;position:fixed;inset:0;z-index:8;background:rgba(10,16,48,.72);align-items:center;justify-content:center;padding:20px}
    #installHelp.show{display:flex}
    #installHelp .card{background:#fff;color:#1A237E;border-radius:18px;padding:18px 16px;max-width:340px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.35)}
    #installHelp h3{margin:0 0 10px;font-size:1.05rem}
    #installHelp ol{margin:0 0 14px;padding-left:1.2rem;font-size:.9rem;line-height:1.45}
    #installHelp .ok{border:0;border-radius:12px;padding:11px 14px;width:100%;background:#1A237E;color:#fff;font-weight:800}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#121A5C;z-index:1}
    @media (display-mode: standalone){#installBar{display:none!important}}
    @media (prefers-reduced-motion:reduce){.bar>i{animation:none;width:100%}#splash{transition:none}}
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><img src="icons/icon-192.png" alt="Weltkind"/></div>
    <div class="brand">WELTKIND</div>
    <div class="sub" id="sub">Открываем оплату</div>
    <div class="bar" id="bar"><i></i></div>
    <button type="button" id="retry">Повторить загрузку</button>
    <button type="button" id="splashInstall">Установить на телефон</button>
  </div>
  <div id="installHelp" role="dialog" aria-modal="true" aria-labelledby="installHelpTitle">
    <div class="card">
      <h3 id="installHelpTitle">Установка оплаты</h3>
      <ol id="installHelpSteps"></ol>
      <button type="button" class="ok" id="installHelpOk">Понятно</button>
    </div>
  </div>
  <div id="installBar">
    <span id="installText">Поставьте оплату иконкой на экран — как приложение</span>
    <button type="button" id="installBtn">Установить</button>
    <button type="button" id="installHide" aria-label="Скрыть">×</button>
  </div>
  <iframe id="subscriber-frame" title="Оплата Weltkind" allow="clipboard-write; payment" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
const SUBSCRIBER_URL = 'https://152.228.99.155:8443/subscriber';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwaSt58hVCmBS1luC-1H850kUPnFKCJQWs4vB7tg7re8AUM2eKAjI8MgWmT1mlxymK5Sw/exec';
const SUB_KEY = 'weltkind-sub-data';
const SOFT_MS = 8000;
const HARD_MS = 20000;
const MAX_AUTO_RETRY = 1;

let siteReady=false, loading=false, loadGen=0, autoRetry=0, deferredInstall=null;
let watchdogSoft=null, watchdogHard=null, optimistic=null;

const splash=document.getElementById('splash');
const sub=document.getElementById('sub');
const frame=document.getElementById('subscriber-frame');

function clearTimers(){
  if(watchdogSoft){clearTimeout(watchdogSoft);watchdogSoft=null;}
  if(watchdogHard){clearTimeout(watchdogHard);watchdogHard=null;}
  if(optimistic){clearTimeout(optimistic);optimistic=null;}
}
function subscriberTarget(fresh){
  const u=new URL(SUBSCRIBER_URL);
  const here=new URL(location.href);
  ['phone','ref','register','message'].forEach(function(k){
    const v=here.searchParams.get(k);
    if(v) u.searchParams.set(k,v);
  });
  const h=(here.hash||'').replace('#','').toLowerCase();
  if(h==='register') u.searchParams.set('register','1');
  if(h==='renew') u.searchParams.set('message','Продлите подписку ниже');
  u.searchParams.set('from','pwa');
  if(fresh) u.searchParams.set('r',String(Date.now()));
  return u.toString();
}
function isPwaInstalled(){
  if(window.matchMedia('(display-mode: standalone)').matches) return true;
  if(navigator.standalone===true) return true;
  try{return localStorage.getItem('wk_pwa_installed')==='1';}catch(e){return false;}
}
function isIosSafari(){return /iPhone|iPad|iPod/i.test(navigator.userAgent||'')&&!window.MSStream;}
function installHidden(){try{return localStorage.getItem('wk_pwa_install_hide')==='1';}catch(e){return false;}}
function isAndroidChrome(){
  const ua=navigator.userAgent||'';
  return /Android/i.test(ua)&&/Chrome|CriOS|EdgA/i.test(ua)&&!/OPR|Opera|SamsungBrowser/i.test(ua);
}
function isMobileBrowser(){
  return isIosSafari()||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'')||(navigator.maxTouchPoints>1&&/Mac/i.test(navigator.platform||''));
}
function paintInstallCopy(){
  const text=document.getElementById('installText');
  const btn=document.getElementById('installBtn');
  if(isIosSafari()){text.textContent='iPhone: Поделиться → На экран «Домой»';btn.textContent='Как';}
  else if(deferredInstall){text.textContent='Поставьте оплату иконкой на экран — как приложение';btn.textContent='Установить';}
  else{text.textContent='Добавьте оплату на экран телефона (меню браузера → Установить / На экран)';btn.textContent='Как';}
}
function showInstallHelp(){
  const ol=document.getElementById('installHelpSteps');ol.innerHTML='';
  const steps=isIosSafari()
    ? ['Откройте сайт в Safari','Нажмите «Поделиться» (квадрат со стрелкой)','Выберите «На экран «Домой»»','Подтвердите «Добавить»']
    : (isAndroidChrome()
      ? ['Откройте сайт в Chrome','Меню ⋮ справа сверху','«Установить приложение» или «На экран»','Подтвердите установку']
      : ['Откройте сайт в Chrome / Safari','Меню браузера','«Установить» / «На экран Домой»','Подтвердите']);
  steps.forEach(function(s){const li=document.createElement('li');li.textContent=s;ol.appendChild(li);});
  document.getElementById('installHelp').classList.add('show');
}
function showInstall(){
  if(isPwaInstalled()||installHidden()) return;
  const splashBtn=document.getElementById('splashInstall');
  if(splashBtn&&!splash.classList.contains('out')) splashBtn.classList.add('ready');
  if(!splash.classList.contains('out')) return;
  if(!isMobileBrowser()&&!deferredInstall) return;
  paintInstallCopy();document.getElementById('installBar').classList.add('show');
}
function tryNativeInstall(){
  if(deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(c){
      deferredInstall=null;
      if(c&&c.outcome==='accepted'){try{localStorage.setItem('wk_pwa_installed','1');}catch(e){}hideInstall();}
      else paintInstallCopy();
    }).catch(function(){showInstallHelp();});
    return;
  }
  showInstallHelp();
}
function hideInstall(){document.getElementById('installBar').classList.remove('show');}
function hideSplash(){splash.classList.add('out');splash.classList.remove('stuck');showInstall();}
function showStuck(msg){
  loading=false;splash.classList.add('stuck');splash.classList.remove('out');
  sub.textContent=msg||'Сайт не открылся. Проверьте интернет и повторите загрузку.';
}
function markReady(){
  siteReady=true;loading=false;autoRetry=0;clearTimers();hideSplash();
}
function armWatchdogs(gen){
  clearTimers();
  watchdogSoft=setTimeout(function(){
    if(gen!==loadGen||siteReady)return;
    sub.textContent='Сайт загружается дольше обычного…';
  },SOFT_MS);
  watchdogHard=setTimeout(function(){
    if(gen!==loadGen||siteReady)return;
    if(autoRetry<MAX_AUTO_RETRY){autoRetry++;sub.textContent='Повторяем загрузку…';loadSubscriber(true);return;}
    showStuck('Сайт не ответил. Проверьте интернет и нажмите «Повторить загрузку».');
  },HARD_MS);
}
function loadSubscriber(fresh){
  if(loading&&!fresh)return;
  loading=true;siteReady=false;loadGen++;
  const gen=loadGen;
  splash.classList.remove('out','stuck');
  sub.textContent=navigator.onLine===false?'Нет сети. Ждём интернет…':'Открываем кабинет оплаты';
  hideInstall();
  if(navigator.onLine===false){loading=false;showStuck('Нет интернета. Включите сеть и нажмите «Повторить загрузку».');return;}
  if(fresh){try{frame.src='about:blank';}catch(e){}}
  frame.src=subscriberTarget(!!fresh);
  armWatchdogs(gen);
}
frame.addEventListener('load',function(){
  if(siteReady)return;
  try{if((frame.src||'').indexOf('about:blank')===0)return;}catch(e){}
  const gen=loadGen;
  if(optimistic)clearTimeout(optimistic);
  sub.textContent='Кабинет загружается…';
  optimistic=setTimeout(function(){if(gen!==loadGen||siteReady)return;markReady();},1200);
});

/* При желании портал может сообщать оболочке о готовности и подписке через postMessage.
   Для безопасности принимаются сообщения только от адреса основного портала. */
window.addEventListener('message',function(e){
  if(e.origin!=='https://152.228.99.155:8443')return;
  const d=e.data;
  if(!d||typeof d!=='object')return;
  if(d.type==='weltkind_ready')markReady();
  if(d.type==='weltkind_sub'){
    markReady();
    const expiry=String(d.expiryDate||'');
    let iso=null;
    if(expiry&&expiry!=='Не определено'&&expiry!=='Не оплачено'){
      const p=expiry.split(/[./-]/);
      if(p.length===3)iso=p[2]+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0');
    }
    const subData={phone:String(d.phone||'').replace(/\D/g,''),date:iso,status:d.status,pwaNotifs:{}};
    try{localStorage.setItem('wk_phone',subData.phone);localStorage.setItem('wk_sub',JSON.stringify(subData));}catch(err){}
    caches.open('Weltkind-user-data').then(function(cache){
      return cache.put(SUB_KEY,new Response(JSON.stringify(subData)));
    }).then(function(){
      if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'bg_check'});
    }).catch(function(){});
    if(typeof Notification!=='undefined'&&Notification.permission==='default')Notification.requestPermission().catch(function(){});
  }
  if(d.type==='weltkind_open'&&d.url){
    try{const u=new URL(d.url);if(u.protocol==='https:')location.href=u.href;}catch(err){}
  }
});

document.getElementById('retry').onclick=function(){autoRetry=0;loadSubscriber(true);};
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;showInstall();});
window.addEventListener('appinstalled',function(){
  try{localStorage.setItem('wk_pwa_installed','1');}catch(e){}
  deferredInstall=null;hideInstall();
});
document.getElementById('installBtn').onclick=function(){tryNativeInstall();};
document.getElementById('splashInstall').onclick=function(){tryNativeInstall();};
document.getElementById('installHelpOk').onclick=function(){document.getElementById('installHelp').classList.remove('show');};
document.getElementById('installHide').onclick=function(){
  try{localStorage.setItem('wk_pwa_install_hide','1');}catch(e){}
  hideInstall();
};

/* Опрос Google Apps Script оставлен только для фоновых сообщений поддержки. */
async function pollChat(){
  let phone='';
  try{phone=localStorage.getItem('wk_phone')||'';}catch(e){}
  if(phone.length<10||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  let since=0;
  try{since=parseInt(localStorage.getItem('wk_chat_ts')||'0',10)||0;}catch(e){}
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const to=ctrl?setTimeout(function(){try{ctrl.abort();}catch(e){}},12000):null;
  try{
    const q=new URLSearchParams({action:'getMessages',phone:phone,since:String(since)});
    const res=await fetch(GAS_URL+'?'+q.toString(),{cache:'no-store',mode:'cors',signal:ctrl?ctrl.signal:undefined});
    const txt=await res.text();const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    if(a<0||b<=a)return;
    const j=JSON.parse(txt.slice(a,b+1));
    if(j.status!=='ok'||!Array.isArray(j.messages)||!j.messages.length)return;
    let maxTs=since;
    const admin=j.messages.filter(function(m){if(m.ts>maxTs)maxTs=m.ts;return m.sender==='admin';});
    try{localStorage.setItem('wk_chat_ts',String(maxTs));}catch(e){}
    if(!admin.length)return;
    const last=admin[admin.length-1];
    if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({
      type:'SHOW_NOTIFICATION',title:'Поддержка Weltkind',
      body:(last.text||'Новое сообщение').slice(0,120),tag:'chat-'+phone,
      requireInteraction:true,data:{url:'./?source=pwa',type:'chat'}
    });
  }catch(e){}
  finally{if(to)clearTimeout(to);}
}
window.addEventListener('online',function(){if(!siteReady){autoRetry=0;loadSubscriber(true);}});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  pollChat();
  if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'bg_check'});
  if(!siteReady&&splash.classList.contains('stuck'))loadSubscriber(true);
});
window.addEventListener('pageshow',function(ev){if(ev.persisted&&!siteReady)loadSubscriber(true);});

loadSubscriber(false);
setTimeout(function(){
  if(!isPwaInstalled()&&!installHidden()){
    const b=document.getElementById('splashInstall');if(b)b.classList.add('ready');
  }
},700);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
    if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    if('periodicSync' in reg)reg.periodicSync.register('check-subscription',{minInterval:12*3600000}).catch(function(){});
    reg.update().catch(function(){});
  }).catch(function(){});
}
setInterval(pollChat,45000);
setInterval(function(){
  if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'bg_check'});
},3600000);
</script>
</body>
</html>
