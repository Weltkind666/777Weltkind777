<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1A237E"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Оплата"/>
  <meta name="description" content="Кабинет оплаты Weltkind"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-180.png"/>
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <title>Оплата Weltkind</title>
  <style>
    html,body{height:100%;margin:0;background:#121A5C;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #splash{
      position:fixed;inset:0;z-index:4;color:#fff;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      background:radial-gradient(120% 80% at 50% 20%,#283593 0%,#1A237E 48%,#121A5C 100%);
      transition:opacity .4s ease,visibility .4s;
    }
    #splash.out{opacity:0;visibility:hidden;pointer-events:none}
    #backup{
      position:absolute;top:12px;left:12px;right:12px;margin:0 auto;max-width:280px;
      border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;
      border-radius:12px;padding:10px 14px;font-weight:750;font-size:.86rem
    }
    #backupChip{
      display:none;position:fixed;top:10px;right:10px;z-index:6;
      border:0;border-radius:12px;padding:8px 12px;background:#1A237E;color:#A7F3E8;
      font-weight:750;font-size:.78rem;box-shadow:0 6px 18px rgba(0,0,0,.28)
    }
    #splash.out ~ #backupChip{display:inline-block}
    .logo{width:92px;height:92px;border-radius:24px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}
    .logo img{width:100%;height:100%;display:block}
    .brand{font-size:1.45rem;font-weight:750;letter-spacing:.18em}
    .sub{font-size:.92rem;opacity:.82;text-align:center;padding:0 28px;line-height:1.45;max-width:300px}
    .bar{width:120px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:8px}
    .bar>i{display:block;height:100%;width:40%;background:#00C4B4;border-radius:99px;animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    #retry{
      display:none;margin-top:18px;border:0;border-radius:14px;padding:12px 22px;
      background:#00C4B4;color:#052e2b;font-weight:800;font-size:.95rem
    }
    #splash.stuck #retry{display:inline-block}
    #splash.stuck .bar{display:none}
    #installBar{
      display:none;position:fixed;left:12px;right:12px;top:10px;z-index:5;
      background:#fff;color:#1A237E;border-radius:14px;padding:10px 12px;
      box-shadow:0 8px 24px rgba(0,0,0,.22);align-items:center;gap:10px
    }
    #installBar.show{display:flex}
    #installBar span{flex:1;font-size:.82rem;font-weight:650;line-height:1.3}
    #installBtn{border:0;border-radius:10px;padding:9px 12px;background:#1A237E;color:#fff;font-weight:800;white-space:nowrap;font-size:.8rem}
    #installHide{border:0;background:transparent;color:#6B7C8A;font-size:1.15rem;padding:2px 6px}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#121A5C;z-index:1}
    @media (display-mode: standalone){ #installBar{display:none!important} }
    @media (prefers-reduced-motion:reduce){.bar>i{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="splash">
    <button type="button" id="backup">Резервный сайт</button>
    <div class="logo"><img src="icons/icon-192.png" alt="Weltkind"/></div>
    <div class="brand">WELTKIND</div>
    <div class="sub" id="sub">Открываем оплату</div>
    <div class="bar" id="bar"><i></i></div>
    <button type="button" id="retry">Повторить загрузку</button>
  </div>
  <button type="button" id="backupChip">Резервный сайт</button>
  <div id="installBar">
    <span id="installText">Можно добавить иконку на экран телефона</span>
    <button type="button" id="installBtn">На экран</button>
    <button type="button" id="installHide" aria-label="Скрыть">×</button>
  </div>
  <iframe id="gas-frame" title="Оплата Weltkind" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxfUBsBIMK6qULmIlqfxoOR9bWtjmc4uofYt3jWjGMd0Ql8kL4u32a7I9cgl22N3pJt8g/exec';
const SUB_KEY = 'weltkind-sub-data';
const SOFT_MS = 12000;
const HARD_MS = 22000;
const FALLBACK_AFTER_LOAD_MS = 4500;
const MAX_AUTO_RETRY = 2;

let gasReady=false, loading=false, loadGen=0, autoRetry=0, deferredInstall=null;
let watchdogSoft=null, watchdogHard=null, optimistic=null;
const splash=document.getElementById('splash');
const sub=document.getElementById('sub');
const frame=document.getElementById('gas-frame');

function clearTimers(){
  if(watchdogSoft){ clearTimeout(watchdogSoft); watchdogSoft=null; }
  if(watchdogHard){ clearTimeout(watchdogHard); watchdogHard=null; }
  if(optimistic){ clearTimeout(optimistic); optimistic=null; }
}
function gasTarget(fresh){
  const u = new URL(GAS_URL);
  const here = new URL(location.href);
  ['phone','ref','register','message'].forEach(function(k){
    const v = here.searchParams.get(k);
    if (v) u.searchParams.set(k, v);
  });
  const h = (here.hash || '').replace('#','').toLowerCase();
  if (h === 'register') u.searchParams.set('register','1');
  if (h === 'renew') u.searchParams.set('message','Продлите подписку ниже');
  u.searchParams.set('from','pwa');
  if (fresh) u.searchParams.set('r', String(Date.now()));
  return u.toString();
}
function backupUrl(){
  const u = new URL(GAS_URL);
  const here = new URL(location.href);
  ['phone','ref','register','message'].forEach(function(k){
    const v = here.searchParams.get(k);
    if (v) u.searchParams.set(k, v);
  });
  return u.toString();
}
function openBackup(){ location.assign(backupUrl()); }
function isPwaInstalled(){
  if(window.matchMedia('(display-mode: standalone)').matches) return true;
  if(navigator.standalone===true) return true;
  try{ return localStorage.getItem('wk_pwa_installed')==='1'; }catch(e){ return false; }
}
function isIosSafari(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent||'') && !window.MSStream; }
function installHidden(){
  try{ return localStorage.getItem('wk_pwa_install_hide')==='1'; }catch(e){ return false; }
}
function showInstall(){
  if(isPwaInstalled() || installHidden() || !splash.classList.contains('out')) return;
  const bar=document.getElementById('installBar');
  if(isIosSafari()){
    document.getElementById('installText').textContent='iPhone: Поделиться → На экран «Домой»';
    document.getElementById('installBtn').textContent='Как';
    bar.classList.add('show');
    return;
  }
  if(deferredInstall) bar.classList.add('show');
}
function hideInstall(){ document.getElementById('installBar').classList.remove('show'); }
function hideSplash(){
  splash.classList.add('out');
  splash.classList.remove('stuck');
  showInstall();
}
function markReady(){
  gasReady=true;
  loading=false;
  autoRetry=0;
  clearTimers();
  hideSplash();
}
function showStuck(msg){
  loading=false;
  splash.classList.add('stuck');
  splash.classList.remove('out');
  sub.textContent=msg || 'Не открылось. Нажмите «Повторить» или «Резервный сайт».';
}
function armWatchdogs(gen){
  clearTimers();
  watchdogSoft=setTimeout(function(){
    if(gen!==loadGen || gasReady) return;
    sub.textContent='Google отвечает дольше обычного…';
  }, SOFT_MS);
  watchdogHard=setTimeout(function(){
    if(gen!==loadGen || gasReady) return;
    if(autoRetry < MAX_AUTO_RETRY){
      autoRetry++;
      sub.textContent='Повторяем загрузку ('+autoRetry+'/'+MAX_AUTO_RETRY+')…';
      loadGas(true);
      return;
    }
    showStuck('Google не ответил. Повторите или откройте резервный сайт.');
  }, HARD_MS);
}
function loadGas(fresh){
  if(loading && !fresh) return;
  loading=true;
  gasReady=false;
  loadGen++;
  const gen=loadGen;
  splash.classList.remove('out','stuck');
  sub.textContent= navigator.onLine === false ? 'Нет сети. Ждём интернет…' : 'Открываем оплату';
  hideInstall();
  if(navigator.onLine === false){
    loading=false;
    showStuck('Нет интернета. Включите сеть и нажмите «Повторить».');
    return;
  }
  try{ frame.removeAttribute('src'); }catch(e){}
  frame.src=gasTarget(!!fresh);
  armWatchdogs(gen);
}
function isGasMessage(e){
  try{
    const o = String(e.origin||'');
    if(/\.google\.com$/i.test(o.replace(/^https?:\/\//,'').split('/')[0].replace(/^[^.]+\./,'')) ||
       /script\.google\.com$/i.test(o) ||
       /googleusercontent\.com$/i.test(o) ||
       /\.google\.com$/i.test(o)) return true;
    // iframe often posts from script.google.com or googleusercontent
    return /google\.com/i.test(o) || /googleusercontent\.com/i.test(o);
  }catch(err){ return false; }
}
function openExternal(url){
  if(!url) return;
  try{
    const a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }catch(e){}
  try{ location.assign(url); }catch(e2){}
}

frame.addEventListener('load', function(){
  if(gasReady) return;
  const gen=loadGen;
  if(optimistic) clearTimeout(optimistic);
  // iframe load часто срабатывает раньше, чем кабинет готов — не прячем splash сразу
  sub.textContent='Кабинет загружается…';
  optimistic=setTimeout(function(){
    if(gen!==loadGen || gasReady) return;
    // мягкий fallback: если postMessage не дошёл, но iframe уже load
    hideSplash();
  }, FALLBACK_AFTER_LOAD_MS);
});

window.addEventListener('message', function(e){
  const d=e.data;
  if(!d || typeof d !== 'object') return;
  if(!isGasMessage(e) && d.type && String(d.type).indexOf('weltkind_')===0){
    // всё равно принимаем weltkind_* — Google иногда шлёт с неожиданным origin через цепочку
  }
  if(d.type==='weltkind_ready' || d.type==='weltkind_sub') markReady();
  if(d.type==='weltkind_open' && d.url){ openExternal(d.url); return; }
  if(d.type!=='weltkind_sub') return;
  const iso=(function(str){
    if(!str || str==='Не определено' || str==='Не оплачено') return null;
    const p=String(str).split(/[./-]/);
    if(p.length===3) return p[2]+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0');
    return null;
  })(d.expiryDate);
  (async function saveSub(subData){
    try{ localStorage.setItem('wk_phone', subData.phone||''); localStorage.setItem('wk_sub', JSON.stringify(subData)); }catch(err){}
    try{
      const cache=await caches.open('Weltkind-user-data');
      await cache.put(SUB_KEY, new Response(JSON.stringify(subData)));
    }catch(err){}
    if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type:'bg_check' });
  })({
    phone:String(d.phone||'').replace(/\D/g,''),
    date:iso,
    status:d.status,
    pwaNotifs:{}
  });
  if(typeof Notification!=='undefined' && Notification.permission==='default') Notification.requestPermission().catch(function(){});
});

document.getElementById('retry').onclick=function(){ autoRetry=0; loadGas(true); };
document.getElementById('backup').onclick=openBackup;
document.getElementById('backupChip').onclick=openBackup;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstall=e;
  showInstall();
});
window.addEventListener('appinstalled', function(){
  try{ localStorage.setItem('wk_pwa_installed','1'); }catch(e){}
  deferredInstall=null;
  hideInstall();
});
document.getElementById('installBtn').onclick=function(){
  if(isIosSafari()){
    sub.textContent='На iPhone: Поделиться → На экран «Домой».';
    splash.classList.remove('out');
    splash.classList.add('stuck');
    return;
  }
  if(!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(c){
    deferredInstall=null;
    if(c && c.outcome==='accepted'){ try{ localStorage.setItem('wk_pwa_installed','1'); }catch(e){} }
    hideInstall();
  }).catch(function(){});
};
document.getElementById('installHide').onclick=function(){
  try{ localStorage.setItem('wk_pwa_install_hide','1'); }catch(e){}
  hideInstall();
};

async function pollChat(){
  const phone=localStorage.getItem('wk_phone')||'';
  if(phone.length<10 || typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const since=parseInt(localStorage.getItem('wk_chat_ts')||'0',10)||0;
  const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const to = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 12000) : null;
  try{
    const q=new URLSearchParams({ action:'getMessages', phone:phone, since:String(since) });
    const res=await fetch(GAS_URL+'?'+q.toString(), { cache:'no-store', mode:'cors', signal: ctrl ? ctrl.signal : undefined });
    const text=await res.text();
    const a=text.indexOf('{'), b=text.lastIndexOf('}');
    if(a<0 || b<=a) return;
    const j=JSON.parse(text.slice(a,b+1));
    if(j.status!=='ok' || !Array.isArray(j.messages) || !j.messages.length) return;
    let maxTs=since;
    const admin=j.messages.filter(function(m){ if(m.ts>maxTs) maxTs=m.ts; return m.sender==='admin'; });
    localStorage.setItem('wk_chat_ts', String(maxTs));
    if(!admin.length) return;
    const last=admin[admin.length-1];
    if(navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({
        type:'SHOW_NOTIFICATION',
        title:'Поддержка Weltkind',
        body:(last.text||'Новое сообщение').slice(0,120),
        tag:'chat-'+phone,
        requireInteraction:true,
        data:{ url:'./?source=pwa', type:'chat' }
      });
    }
  }catch(e){}
  finally{ if(to) clearTimeout(to); }
}

window.addEventListener('online', function(){
  if(!gasReady){ autoRetry=0; loadGas(true); }
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  pollChat();
  if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type:'bg_check' });
  if(!gasReady && splash.classList.contains('stuck')) loadGas(true);
});
window.addEventListener('pageshow', function(ev){
  if(ev.persisted && !gasReady) loadGas(true);
});

loadGas(false);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){
    if(reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
    if('periodicSync' in reg) reg.periodicSync.register('check-subscription', { minInterval:12*3600000 }).catch(function(){});
    reg.update().catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      // новый SW подхватится на следующем открытии; не форсим reload во время оплаты
    });
  }).catch(function(){});
}
setInterval(pollChat, 45000);
setInterval(function(){
  if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type:'bg_check' });
}, 3600000);
</script>
</body>
</html>
